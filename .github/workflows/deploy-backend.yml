name: Deploy Backend to Cloud Run

on:
  push:
    branches: [ main, production ]
    paths: [ 'backend/**' ]
  workflow_dispatch:

env:
  PROJECT_ID: neuronest-app
  SERVICE_NAME: neuronest-backend
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v1'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'
    
    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@v1'
      with:
        project_id: ${{ env.PROJECT_ID }}
    
    - name: 'Configure Docker to use gcloud as a credential helper'
      run: |
        gcloud auth configure-docker
    
    - name: 'Deploy to Cloud Run'
      run: |
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --source ./backend \
          --platform managed \
          --region ${{ env.REGION }} \
          --allow-unauthenticated \
          --port 8080 \
          --memory 1Gi \
          --cpu 1 \
          --max-instances 10 \
          --timeout 300 \
          --set-env-vars ENVIRONMENT=production \
          --set-env-vars SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
          --set-env-vars SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          --set-env-vars OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
          --set-env-vars SECRET_KEY="${{ secrets.SECRET_KEY }}"
    
    - name: 'Get service URL'
      run: |
        SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')
        echo "Service deployed at: $SERVICE_URL"
        echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
    
    - name: 'Test deployment'
      run: |
        curl -f $SERVICE_URL/health || exit 1
        echo "✅ Backend deployment successful!"