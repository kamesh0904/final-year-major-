name: Deploy Frontend to Firebase

on:
  push:
    branches: [ main, production ]
    paths: [ 'frontend/**' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Create production environment file
      run: |
        cd frontend
        echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" > .env.production
        echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.production
        echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.production
        echo "VITE_ENVIRONMENT=production" >> .env.production
    
    - name: Build application
      run: |
        cd frontend
        npm run build
    
    - name: Deploy to Firebase Hosting
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
        projectId: neuronest-app
        channelId: live
    
    - name: Test deployment
      run: |
        echo "✅ Frontend deployment successful!"
        echo "🌐 Visit your app at: https://neuronest-app.web.app"